name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/build-dmg.sh
        env:
          SIGN_ID: "-" # CI artifacts are ad-hoc; local builds use a stable identity
      - uses: actions/upload-artifact@v4
        with:
          name: Notchling-dmg
          path: dist/*.dmg
